server:
  port: 3010
spring:
  datasource:
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/code-club?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 20
      min-idle: 20
      max-active: 100
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_CONSOLE_USER:admin}
        login-password: ${DRUID_CONSOLE_PASSWORD:}
      filter:
        stat:
          enabled: true
          slow-sql-millis: 2000
          log-slow-sql: true
        wall:
          enabled: true
        config:
          enabled: true
      connection-properties: config.decrypt=false
  # redis配置
  redis:
    # Redis数据库索引（默认为0）
    database: 1
    # Redis服务器地址
    host: ${REDIS_HOST:localhost}
    # Redis服务器连接端口
    port: 6379
    # Redis服务器连接密码（默认为空）
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 2s
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 200
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
        # 连接池中的最大空闲连接
        max-idle: 10
        # 连接池中的最小空闲连接
        min-idle: 0
logging:
  config: classpath:log4j2-spring.xml
#mybatis-plus:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
es:
  cluster:
    esConfigs[0]:
      name: 4c433e9c4034
      nodes: ${ES_HOST:localhost}:9200
xxl:
  job:
    admin:
      addresses: http://${XXL_JOB_HOST:localhost}:8088/xxl-job-admin
    accessToken: default_token
    executor:
      appname: code-club-subject
      address:
      ip: 127.0.0.1
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

rocketmq:
  name-server: ${ROCKETMQ_HOST:localhost}:9876
  producer:
    group: test-group
